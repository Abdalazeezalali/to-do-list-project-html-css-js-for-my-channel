<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام البسيطة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>قائمة المهام</h1>

        <form id="todoForm" class="form-group">
            <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." required>
            <button type="submit" class="add-btn">إضافة</button>
        </form>

        <ul id="taskList"></ul>
        <p id="emptyText" class="empty-text">لا توجد مهام حالياً</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
